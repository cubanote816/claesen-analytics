# Campaign open pixel and click redirect (MAILING_TRACKING_DOMAIN, CLA-654/656).
#
# Include inside the server { } block of the public vhost that serves
# service.claesen-verlichting.be on sbapu03:
#
#     include /etc/nginx/snippets/mailing-tracking.conf;
#
# Recipients open these URLs from outside the private network. ^~ stops nginx
# from trying regex locations, so a static-asset rule such as
# `location ~* \.(gif|js|css)$` cannot take the .gif pixel, wherever this
# include sits. The nested regex mirrors the route constraints in
# Modules/Mailing/routes/web.php; anything else under /mailing/track/ is a 404
# and nothing else under /mailing/ reaches the backend through this snippet.
#
# proxy_pass must point at the same backend as the vhost's existing /api/
# location (127.0.0.1:9443 on sbapu03 at the time of writing).
location ^~ /mailing/track/ {
    location ~ "^/mailing/track/(open/[A-Za-z0-9]{64}(\.gif)?|click/[A-Za-z0-9]{64}/[a-f0-9]{12})$" {
        limit_except GET {
            deny all;
        }

        proxy_pass https://127.0.0.1:9443;
        proxy_ssl_verify      off;
        proxy_ssl_server_name on;
        proxy_ssl_name        backoffice.claesen.local;
        proxy_set_header      Host backoffice.claesen.local;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    30s;
        proxy_redirect        https://backoffice.claesen.local https://service.claesen-verlichting.be;
    }

    return 404;
}

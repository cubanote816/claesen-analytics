server {
    listen 80;
    listen [::]:80;
    server_name client.claesen-verlichting.be;
    return 301 https://client.claesen-verlichting.be$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name client.claesen-verlichting.be;

    ssl_certificate     /etc/letsencrypt/live/client.claesen-verlichting.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/client.claesen-verlichting.be/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Static build output of Claesen-Client (`npm run build` -> dist/), synced here.
    # No API proxy block here: the SPA calls backend.claesen-verlichting.be directly,
    # cross-origin, with credentials — this origin only needs to exist in
    # cors-map.conf and SANCTUM_STATEFUL_DOMAINS, not be proxied through.
    root /var/www/client.claesen-verlichting.be/public;
    index index.html;

    server_tokens off;
    client_max_body_size 5M;

    # SPA fallback so client-side routes (React state, no history-API routing
    # today, but this keeps a hard refresh on any path from 404ing) resolve to
    # index.html instead of a raw nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # vite-plugin-pwa's service worker / manifest must never be cached long,
    # otherwise clients get stuck on a stale app shell after a deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        allow all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/client-claesen.access.log;
    error_log  /var/log/nginx/client-claesen.error.log;
}

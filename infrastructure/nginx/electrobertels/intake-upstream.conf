# CLA-705 — Electro Bertels landing: same-origin contact intake (http context).
#
# Include ONCE in the http {} context of the host that serves electrobertels.be,
# e.g. /etc/nginx/conf.d/electrobertels-intake-upstream.conf.
#
# HOST-SPECIFIC: `server` must be the address through which THIS host reaches the
# backoffice (backoffice.claesen.local, prod-priv-01) — the same path the other
# public frontends already use. On the tunnel host (sbapu03) that is the tunnel
# on 127.0.0.1:9443. On any other host (the landing runs on 192.168.60.10)
# confirm the path first, and confirm Laravel still sees the visitor's IP:
# Laravel trusts X-Forwarded-For only from 127.0.0.1 (bootstrap/app.php
# trustProxies), so a connection that arrives from another address makes every
# visitor share one rate-limit bucket. The limit_req zone below keeps a per-IP
# limit at this edge either way.
upstream claesen_backoffice_intake {
    server 127.0.0.1:9443;
}

# Per-visitor limit at the edge: 10 requests/minute, same as Laravel's
# website.intake_hardening.rate_limit default.
limit_req_zone $binary_remote_addr zone=bertels_intake:1m rate=10r/m;

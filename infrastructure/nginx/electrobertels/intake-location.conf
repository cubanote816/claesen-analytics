# CLA-705 — Electro Bertels landing: same-origin contact intake (server context).
#
# Include inside the HTTPS server {} of electrobertels.be (and www), before
# `location /`. Requires intake-upstream.conf in the http {} context.
#
# The landing's form posts JSON to /intake/consultations. Only that exact path
# and only POST is forwarded; nothing else of the backoffice (/v1/*, /api/*,
# /bertels/*, login) becomes reachable from this site, and no CORS is needed.
location = /intake/consultations {
    limit_except POST { deny all; }
    client_max_body_size 64k;

    limit_req zone=bertels_intake burst=5 nodelay;
    limit_req_status 429;

    # The site is pinned here, never chosen by the visitor: the trailing "?"
    # drops the visitor's query string. Laravel answers 503 if this site is
    # not active (EnsureRequestedSiteResolved) instead of filing under Claesen.
    rewrite ^ /v1/website/consultations?site=electro-bertels? break;

    proxy_pass https://claesen_backoffice_intake;
    proxy_ssl_verify      off;   # same as the existing tunnel locations
    proxy_ssl_server_name on;
    proxy_ssl_name        backoffice.claesen.local;
    proxy_set_header      Host backoffice.claesen.local;

    # Replace, never append: the visitor cannot inject an address.
    proxy_set_header      X-Forwarded-For $remote_addr;
    proxy_set_header      X-Real-IP $remote_addr;
    proxy_set_header      X-Forwarded-Proto $scheme;

    # A public form needs no session: no cookies or credentials either way.
    proxy_set_header      Cookie "";
    proxy_set_header      Authorization "";
    proxy_hide_header     Set-Cookie;

    proxy_read_timeout    60s;
}

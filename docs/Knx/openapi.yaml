  /conflicts:
    get:
      tags: [conflicts]
      summary: Conflictencentrum; `status=active` = open + in_review
      description: >-
        Cambio de KNX-56: cada conflicto lleva `lifecycle` (`ets` | `malfunction`). `ets` es
        el ciclo de 8 estados de siempre, libre y reversible. `malfunction` es la incidencia
        de la instalación física: `open → diagnosing → resolved → verified`, con `rejected`
        como salida. El `symptom` describe lo que hace mal el elemento; en un conflicto ETS
        ese papel lo ocupa `proposal`. El histórico añade `by` y `note` a quien ejecutó el paso.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, in_review, ets_listed, applied, downloaded, verified, closed, rejected, active, all] }
        - name: lifecycle
          in: query
          schema: { type: string, enum: [ets, malfunction] }
        - name: project
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/ValidationError" }
  /conflicts/{id}:
    get:
      tags: [conflicts]
      summary: Detalle de conflicto con su histórico append-only, su `lifecycle` y su `symptom`
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [conflicts]
      summary: Cambia el estado; cada cambio escribe una línea de histórico con autor (`by`)
      description: >-
        Para `lifecycle: ets` no hay máquina de estados: toda transición es reversible. Para
        `lifecycle: malfunction` la transición se valida (`open → diagnosing → resolved →
        verified`, `rejected` como salida) y una no permitida responde `422` en
        `errors.status`. `note` viaja a la línea de histórico.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
                proposal: { type: string, nullable: true }
                note: { type: string, nullable: true }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: La propuesta cambia a una dirección ya ocupada
          content:
            application/json:
              example: { message: "The address [1.1.133] is already in use.", code: address_in_use, errors: { proposal: ["The address [1.1.133] is already in use."] } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /zones:
    get:
      tags: [zones]
      summary: Zonas de preparación; lectura compartida por las dos apps
      parameters:
        - name: project
          in: query
          schema: { type: string }
      responses:
        "200": { description: OK }
  /zones/{id}:
    get:
      tags: [zones]
      summary: Detalle de zona con los 8 checks y el estado derivado
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
  /zones/{id}/checks/{key}:
    patch:
      tags: [zones]
      summary: Cambia un check (sólo oficina); `failed`/`na` exigen `note`
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: key
          in: path
          required: true
          schema: { type: string, enum: [installed, power, bus, device_ids, loads, materials, function_approved, blockers] }
      responses:
        "200": { description: Zona ya recomputada }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /notifications:
    get:
      tags: [notifications]
      summary: "Avisos de la bandeja, generalizados por `kind` (incluye los confirmados con `acked: true`)"
      description: >-
        Cambio de KNX-54: la fila es un aviso tipado. `kind` dice qué pasó; `title`/`summary`
        son la línea humana; `actor` y `target` dicen quién lo hizo y sobre qué. Los campos viejos
        de la registración (`address`, `type`, `room`, `board`, `boardName`, `serial`, `reportedBy`,
        `reportedAt`) siguen presentes: es compatible hacia atrás.
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [device_registered, board_created, module_added, module_changed, address_conflict, intent_changed, issue_reported, malfunction_reported, malfunction_status_changed, visit_closed]
        - name: project
          in: query
          schema: { type: string }
        - name: unacked
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                - id: "44"
                  kind: "board_created"
                  projectCode: "000026"
                  title: "Nieuw verdeelbord gemeld"
                  summary: "Nieuw verdeelbord (werf)"
                  roomId: null
                  boardId: "nieuw-verdeelbord-werf"
                  moduleSlot: null
                  deviceId: null
                  issueId: null
                  actor: { id: "115", name: "J. Van Dyck" }
                  target: { type: "board", id: "nieuw-verdeelbord-werf" }
                  capturedAt: "2026-10-08T09:00:00Z"
                  receivedAt: "2026-10-08T09:00:04Z"
                  acked: false
                  address: null
                  type: null
                  room: null
                  board: "E77"
                  boardName: "Nieuw verdeelbord (werf)"
                  serial: null
                  projectName: "Den Brand"
                  reportedBy: "J. Van Dyck"
                  reportedAt: "2026-10-08T09:00:04Z"
        "422": { $ref: "#/components/responses/ValidationError" }
  /notifications/ack-all:
    post:
      tags: [notifications]
      summary: Confirma todas las pendientes (idempotente)
      responses:
        "204": { description: Sin contenido — confirmadas }
  /notifications/{id}/ack:
    post:
      tags: [notifications]
      summary: Confirma una notificación; confirma también el aparato que la creó
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:

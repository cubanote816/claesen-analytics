  /field/projects/{code}/plans:
    get:
      tags: [field]
      summary: Planos descargables (sólo dibujos con fichero y tipo nombrable)
      description: >-
        `mimeType` sale de la columna (o de la extensión para documentos
        anteriores); `url` es una firma de una semana, porque el técnico
        descarga una vez y abre sin conexión.
      parameters:
        - $ref: "#/components/parameters/Code"
      responses:
        "200": { description: OK }
        "403": { description: Proyecto no asignado hoy }
  /field/projects/{code}/boards:
    get:
      tags: [field]
      summary: Los cuadros reales del proyecto, para que el registro no use los de la maqueta
      description: >-
        Misma forma que el listado de oficina (cuadros con módulos, canales y enlaces, y `roomId`
        resuelto por enlace). Hoy `/boards` responde `401` con un token de campo porque vive detrás
        del guard de oficina; esta es la lectura que el registro necesita.
      parameters:
        - $ref: "#/components/parameters/Code"
      responses:
        "200": { description: "OK — `boards: []` es un estado real (worklist sin importar)" }
        "403": { description: Proyecto no asignado hoy }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [field]
      summary: Crea un cuadro desde obra (idempotente por `clientId`, nace `unreviewed`)
      description: >-
        El servidor deriva el `id` (el slug) y lo devuelve. Nace `origin: field` y
        `reviewState: unreviewed`: la oficina lo confirma. Un reintento con el mismo `clientId`
        devuelve el mismo cuadro (`200`); la misma clave en otro proyecto es `422`.
      parameters:
        - $ref: "#/components/parameters/Code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, code, name, capturedAt]
              properties:
                clientId: { type: string, maxLength: 64 }
                code: { type: string, maxLength: 32 }
                name: { type: string, maxLength: 255 }
                floor: { type: string, maxLength: 64, nullable: true }
                photoDataUrl: { type: string, nullable: true }
                capturedAt: { type: string, format: date-time }
      responses:
        "201": { description: "Cuadro creado — `origin: field`, `reviewState: unreviewed`" }
        "200": { description: "Reintento del mismo `clientId` — mismo cuadro" }
        "403": { description: Proyecto no asignado hoy }
        "422": { $ref: "#/components/responses/ValidationError" }
  /field/projects/{code}/boards/{boardId}/modules:
    post:
      tags: [field]
      summary: Añade un módulo desde obra (idempotente por `clientId`, nace `unreviewed`)
      parameters:
        - $ref: "#/components/parameters/Code"
        - name: boardId
          in: path
          required: true
          description: El `id` estable del cuadro que devuelve `GET /field/projects/{code}/boards`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, device, slot, capturedAt]
              properties:
                clientId: { type: string, maxLength: 64 }
                device: { type: string, maxLength: 64 }
                slot: { type: integer, minimum: 1 }
                photoDataUrl: { type: string, nullable: true }
                capturedAt: { type: string, format: date-time }
      responses:
        "201": { description: "Módulo creado — `origin: field`, `reviewState: unreviewed`" }
        "200": { description: Reintento del mismo `clientId` }
        "403": { description: Proyecto no asignado hoy }
        "409":
          description: El slot ya está ocupado
          content:
            application/json:
              example: { message: "Slot 2 is already taken on this board.", code: slot_taken, errors: { slot: ["Slot 2 is already taken on this board."] }, module: { device: "SA/S8.16.2.2", slot: 2 } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /field/projects/{code}/rooms:
    get:
      tags: [field]
      summary: Fichas de habitación de todo el proyecto, para cachear sin red
      parameters:
        - $ref: "#/components/parameters/Code"
      responses:
        "200":
          description: "OK — mismo `RoomSheet` que la ficha de oficina"
        "403": { description: Proyecto no asignado hoy }
        "404": { $ref: "#/components/responses/NotFound" }
  /field/projects/{code}/plans/{documentId}/model:
    get:
      tags: [field]
      summary: Modelo de plano cacheable (sólo habitaciones confirmadas + marcadores de esa página)
      description: >-
        Deliberadamente reducido: sólo las habitaciones en `state: confirmed` y los marcadores de
        cuadro de esa página. Lo `proposed` no viaja a obra: el técnico no debe leer como verdad una
        propuesta que la oficina todavía no revisó.
      parameters:
        - $ref: "#/components/parameters/Code"
        - $ref: "#/components/parameters/DocumentId"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200": { description: OK }
        "403": { description: Proyecto no asignado hoy }
        "404": { $ref: "#/components/responses/NotFound" }
  /field/projects/{code}/devices:
    get:
      tags: [field]
      summary: Aparatos del proyecto (mismo `Device` shape que el dossier)
      parameters:
        - $ref: "#/components/parameters/Code"
      responses:
        "200": { description: OK }
        "403": { description: Proyecto no asignado hoy }
    post:
      tags: [field]
      summary: Registra un aparato desde obra (idempotente por `clientId`)
      description: >-
        Un `clientId` repetido devuelve el mismo aparato (`200`); otra dirección
        ya ocupada responde `409 address_in_use` y además escribe un conflicto
        `duplicate_address` con la foto como evidencia. Crear el aparato crea
        también su notificación.
      parameters:
        - $ref: "#/components/parameters/Code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, projectCode, address, type, roomId, capturedAt]
              properties:
                clientId: { type: string, maxLength: 64 }
                projectCode: { type: string, description: "Debe coincidir con `{code}`" }
                address: { type: string, maxLength: 32 }
                type: { type: string, maxLength: 100 }
                roomId: { type: string, maxLength: 64, description: Debe ser una sala del proyecto }
                roomName: { type: string, nullable: true, maxLength: 150 }
                floor: { type: string, nullable: true, maxLength: 100 }
                boardCode: { type: string, nullable: true, maxLength: 32 }
                boardId: { type: string, nullable: true, maxLength: 128, description: "El `id` estable del cuadro (KNX-53); debe ser del proyecto." }
                moduleSlot: { type: integer, nullable: true, description: "El slot del módulo dentro del cuadro (KNX-53)." }
                channel: { type: string, nullable: true, maxLength: 8, description: "El canal dentro del módulo (KNX-53)." }
                serial: { type: string, nullable: true, maxLength: 64 }
                note: { type: string, nullable: true, maxLength: 1000 }
                photoDataUrl: { type: string, nullable: true }
                capturedAt: { type: string, format: date-time }
      responses:
        "201":
          description: Aparato creado
          content:
            application/json:
              example: { id: "88", address: "1.1.131", type: "SA/S8.16.2.1", roomName: "Inkomhal", boardCode: "E10", serial: "", registeredBy: "J. Van Dyck", registeredAt: "2026-10-06T09:42:00+02:00" }
        "200":
          description: Reintento del mismo `clientId` — mismo aparato
          content:
            application/json:
              example: { id: "88", address: "1.1.131", type: "SA/S8.16.2.1", roomName: "Inkomhal", boardCode: "E10", serial: "", registeredBy: "J. Van Dyck", registeredAt: "2026-10-06T09:42:00+02:00" }
        "403": { description: Proyecto no asignado hoy }
        "409":
          description: Dirección ocupada
          content:
            application/json:
              example: { message: "The address [1.1.133] is already in use.", code: address_in_use, errors: { proposal: ["The address [1.1.133] is already in use."] }, existing: {} }
        "422": { $ref: "#/components/responses/ValidationError" }
  /field/projects/{code}/issues:
    post:
      tags: [field]
      summary: Reporta una incidencia desde obra (idempotente por `clientId`)
      description: >-
        Una incidencia **es** un conflicto con el `kind` mapeado a los tipos de oficina y el
        contexto conservado en `device_field`. KNX-56 añade `kind: malfunction` (la instalación
        física que no funciona, distinto de dañado o falta), su `symptom` obligatorio, y los
        ids opcionales `roomId`/`deviceId`/`boardId`/`moduleSlot`; `room`/`deviceAddress`/`boardCode`
        siguen valiendo. Un `malfunction` nace con `lifecycle: malfunction` y avisa al momento.
      parameters:
        - $ref: "#/components/parameters/Code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, projectCode, kind, capturedAt]
              properties:
                clientId: { type: string, maxLength: 64 }
                projectCode: { type: string }
                projectName: { type: string, nullable: true }
                kind: { type: string, enum: [damaged, missing, plan_mismatch, other, malfunction] }
                symptom: { type: string, nullable: true, description: "Obligatorio cuando `kind: malfunction`: qué hace mal el elemento." }
                room: { type: string, nullable: true }
                roomId: { type: integer, nullable: true }
                deviceAddress: { type: string, nullable: true }
                deviceId: { type: integer, nullable: true }
                boardCode: { type: string, nullable: true }
                boardId: { type: string, nullable: true }
                moduleSlot: { type: integer, nullable: true }
                channel: { type: string, nullable: true }
                note: { type: string, nullable: true }
                photoDataUrl: { type: string, nullable: true }
                capturedAt: { type: string, format: date-time }
      responses:
        "201":
          description: Conflicto creado
          content:
            application/json:
              example: { id: "16", clientId: "6f1c9d2e-3a44-4b1e-9c7f-2f0a8e5d1b3c" }
        "200":
          description: Reintento del mismo `clientId`
          content:
            application/json:
              example: { id: "16", clientId: "6f1c9d2e-3a44-4b1e-9c7f-2f0a8e5d1b3c" }
        "403": { description: Proyecto no asignado hoy }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{code}/issues:
    post:
      tags: [conflicts]
      summary: La oficina abre una incidencia (KNX-56)
      description: >-
        Misma incidencia que la de campo, sin `clientId` (no hay reintento offline). El objetivo es
        opcional: `roomId`, `deviceId`, `boardId`, `moduleSlot`, `channel`. `kind: malfunction` crea
        un conflicto con `lifecycle: malfunction` y su `symptom`, y **siempre** avisa al momento
        (`kind: malfunction_reported`); el resto de `kind` sigue creando un conflicto ETS.
      parameters:
        - $ref: "#/components/parameters/Code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [damaged, missing, plan_mismatch, other, malfunction] }
                symptom: { type: string, nullable: true, description: "Obligatorio cuando `kind: malfunction`." }
                roomId: { type: integer, nullable: true }
                deviceId: { type: integer, nullable: true }
                boardId: { type: string, nullable: true }
                moduleSlot: { type: integer, nullable: true }
                channel: { type: string, nullable: true }
                note: { type: string, nullable: true }
                photoDataUrl: { type: string, nullable: true }
      responses:
        "201":
          description: Incidencia creada
          content:
            application/json:
              example: { id: "17", lifecycle: malfunction, type: malfunction, status: open, symptom: "Gaat niet aan." }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{code}/intents:
    get:
      tags: [intents]
      summary: Intenciones vigentes del proyecto, filtrables por elemento o habitación
      description: >-
        La intención es qué debería hacer un elemento, escrita por el jefe de proyecto y versionada
        (KNX-55). Un mismo elemento tiene una sola intención vigente; el historial vive en
        `GET /intents/{id}/versions`. `target.type` ∈ `module` (`boardId`+`slot`), `channel`
        (`boardId`+`slot`+`channel`) o `device` (`deviceId`).
      parameters:
        - $ref: "#/components/parameters/Code"
        - name: boardId
          in: query
          schema: { type: string }
        - name: slot
          in: query
          schema: { type: integer }
        - name: deviceId
          in: query
          schema: { type: integer }
        - name: roomId
          in: query
          schema: { type: integer }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [intents]
      summary: Escribe la intención de un elemento (upsert por `target`, versiona)
      description: >-
        `target` es la clave, así que el front no arrastra un id entre llamadas. Si ya hay intención
        para ese elemento se crea una versión nueva y la anterior queda en el historial; un `PUT`
        que no cambia nada devuelve la vigente sin subir versión. Cada cambio genera un aviso
        `intent_changed`.
      parameters:
        - $ref: "#/components/parameters/Code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, text]
              properties:
                target:
                  type: object
                  required: [type]
                  properties:
                    type: { type: string, enum: [module, channel, device] }
                    boardId: { type: string, nullable: true }
                    slot: { type: integer, nullable: true }
                    channel: { type: string, nullable: true }
                    deviceId: { type: integer, nullable: true }
                text: { type: string, maxLength: 5000 }
                roomId: { type: integer, nullable: true }
                functionId: { type: integer, nullable: true }
      responses:
        "200":
          description: Intención vigente, con su `version` incrementada
          content:
            application/json:
              example: { id: "12", target: { type: module, boardId: E10, slot: 3, channel: null, deviceId: null }, roomId: "510", functionId: null, text: "Schakelt de gang met aanwezigheid.", version: 2, author: { id: "113", name: "L. Smet" }, updatedAt: "2026-10-09T15:00:00Z" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /intents/{id}/versions:
    get:
      tags: [intents]
      summary: Todas las versiones de una intención, la última primero
      description: >-
        Ruta por id sin proyecto: resuelve por el proyecto de la intención y la organización.
        Otra organización responde `404`.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
  /field/projects/{code}/intents:
    get:
      tags: [field]
      summary: Intenciones del proyecto, para cachear sin red (KNX-55)
      description: >-
        El campo las lee, también sin conexión. Escribir desde obra sigue `pending-decision`: la
        ruta no existe y una llamada responde `404`.
      parameters:
        - $ref: "#/components/parameters/Code"
      responses:
        "200": { description: OK }
        "403": { description: Proyecto no asignado hoy }
        "404": { $ref: "#/components/responses/NotFound" }
  /field/projects/{code}/visits:
    post:
      tags: [field]
      summary: Cierra una visita en una de sus tres fases (idempotente por `clientId`)
      description: >-
        `type` ∈ `visit_end`/`partial`/`final`. Cerrar una visita **no** cambia
        el estado del proyecto, no abre conflictos y no cierra pruebas: son
        etiquetas de texto libre del técnico.
      parameters:
        - $ref: "#/components/parameters/Code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, projectCode, type, capturedAt]
              properties:
                clientId: { type: string, maxLength: 64 }
                projectCode: { type: string }
                type: { type: string, enum: [visit_end, partial, final] }
                minutes: { type: integer, nullable: true }
                roomId: { type: string, nullable: true }
                roomName: { type: string, nullable: true }
                workDone: { type: string, nullable: true }
                pending: { type: array, items: { type: string } }
                reservations: { type: array, items: { type: string } }
                verifiedFunctions: { type: array, items: { type: string } }
                documents: { type: array, items: { type: string } }
                capturedAt: { type: string, format: date-time }
      responses:
        "201":
          description: Cierre registrado
          content:
            application/json:
              example: { id: "12", clientId: "b2e5a1c4-77d0-4f39-8a2e-1c9d3b6f4e08" }
        "200":
          description: Reintento del mismo `clientId`
          content:
            application/json:
              example: { id: "12", clientId: "b2e5a1c4-77d0-4f39-8a2e-1c9d3b6f4e08" }
        "403": { description: Proyecto no asignado hoy }
        "422": { $ref: "#/components/responses/ValidationError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de Sanctum emitido por `POST /auth/login`
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Code:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9._-]+$" }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthenticated:
      description: Sin token, token caducado, o token de la otra app (los dos casos son indistinguibles a propósito)
      content:
        application/json:
          example: { message: "Unauthenticated.", code: unauthenticated, errors: {} }
    NotFound:
      description: No existe, o no es de este tenant/proyecto
      content:
        application/json:
          example: { message: "Not found.", code: not_found, errors: {} }
    ValidationError:
      description: Error de validación campo a campo
      content:
        application/json:
          example: { message: "The given data was invalid.", code: validation_error, errors: { code: ["..."] } }

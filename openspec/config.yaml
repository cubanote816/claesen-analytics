# OpenSpec SDD configuration — claesen_api_web_oficial
# Generated by sdd-init (CLA-535 bootstrap, 2026-09-13). User-maintainable; derived
# context may be updated by later sdd-init runs. Do not rewrite by hand-destructively.

project:
  name: claesen-analytics
  repo: claesen_api_web_oficial
  summary: >-
    Claesen web + backoffice application. Laravel 13 monolith organised into
    nwidart modules (Website, Core, Cafca, Analytics, Mailing, Prospects,
    Intelligence, Performance, Safety, FieldOps, Employee — all enabled in
    modules_statuses.json). Backoffice UI is Filament 5.7.
  stack:
    language: PHP 8.4 (host CLI 8.4.25; CI runs PHP 8.4)
    framework: Laravel ^13.0
    admin_ui: Filament ^5.7
    modules: nwidart/laravel-modules ^13.0
    tests: PHPUnit ^12 via `php artisan test`
    database: MySQL 8.x (Docker)
    style: Laravel Pint (CI enforces static checks + PHPUnit)
  harness_rules:
    - Read CLAUDE.md, handoff.md, docs/ai/README.md before any task (AGENTS.md startup contract).
    - No ticket / no plan / no approval => no edits; no tests/checks => no closure; no memory update => no closure; no commit => no Done.
    - Do not read or copy secrets; never include .env or .agent/skills in changes.
    - UTF-8 clean files; present a plan before editing; wait for GO before implementing.

testing:
  strict_tdd: true
  runner: php artisan test (PHPUnit 12, phpunit.xml at repo root)
  test_suites:
    - Unit (tests/Unit)
    - Feature (tests/Feature)
    - Modules (Modules/**/*Test.php, including Modules/<Module>/tests)
  database_environment:
    note: >-
      Default .env DB_HOST=mysql does not resolve from the host. Tests must be
      run against the Docker MySQL container
      claesen_api_opportunities_module-mysql-1 exposed on host port 3308
      (creds sail/password). phpunit.xml pins DB_DATABASE=claesen_analytics_web_testing,
      APP_ENV=testing, QUEUE_CONNECTION=sync, MAILING_DRIVER=simulation.
  scoped_test_commands:
    prospects_module: >-
      DB_HOST=127.0.0.1 DB_PORT=3308 php artisan test --filter=Prospects Modules/Prospects/tests
    prospects_baseline: 32 tests / 88 assertions passing (verified 2026-09-13, ~70s)
  full_suite:
    command: DB_HOST=127.0.0.1 DB_PORT=3308 php artisan test
    note: >-
      Historical note from handoff.md CLA-528: full run reached ~1305 passed with
      11 preexisting Mailing failures (dispatch/clock bugs). Those 11 were later
      closed by CLA-529 (1322 passed / 0 failures on release/laravel-13-rc1).
      Treat any NEW failure outside known preexisting ones as blocking.
  tdd_rules:
    - Write a failing test first; confirm RED before implementation, GREEN after.
    - Every behavior change in Modules/** needs a co-located test under Modules/<Module>/tests.
    - Run the scoped test command for the touched module before declaring progress.
    - Run the touched-module suite unfiltered before phase closure.
    - Do not mark a task Done without tests, memory update, and commit.

phase_rules:
  init:
    - Verify stack, runner, conventions; record project context here and in Engram.
    - Never block the caller on preexisting failures unrelated to current scope.
  proposal:
    - Proposals must reference the active ticket (e.g. CLA-535) and prior audit evidence.
    - Include explicit non-goals and risk assessment per changed module.
  apply:
    - Implement strict TDD per testing.tdd_rules; one work unit per commit.
    - No edits without an approved plan/GO (AGENTS.md rule).
  review:
    - Keep each review slice <= 400 changed lines (review budget); split otherwise (chained PRs).
    - Verify docs/handoff.md and memory are updated in the same work unit or a dedicated doc commit.
  archive:
    - Close only after scoped + relevant suites are green, memory saved, and handoff.md updated.

active_scope:
  ticket: CLA-535
  title: "Prospects: federation data-source refactor + audit fixes"
  branch: audit/prospects-module
  module: Modules/Prospects
  audit_memory: Engram observation 70 (topic_key prospects-module-audit, project claesen-analytics)
